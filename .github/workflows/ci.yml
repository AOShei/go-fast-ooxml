name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # Tests that need LibreOffice, pandoc, the Python tools or the
      # downloaded corpus skip themselves when those are absent, as here.
      - name: Test
        run: go test -race ./...

      # Systems the tests do not run on, among them ones where an int is
      # 32 bits: the code must at least build and pass vet there.
      - name: Other systems
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in linux/386 linux/arm linux/arm64 freebsd/amd64 js/wasm; do
            echo "$target"
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./...
          done

      # And the tests as a 32-bit program, which a 64-bit Linux runs.
      - name: Test, 32-bit
        if: matrix.os == 'ubuntu-latest'
        run: GOARCH=386 go test -short ./...

      # A view the scanner gives (a name, text, an attribute's value)
      # lasts until the next token. With the xmlscanpoison tag the bytes
      # of every token passed are overwritten, so a reader that keeps a
      # view too long reads '#' and its test fails, however the input
      # arrived. See internal/xmlscan/poison.go.
      - name: Test, scanner views overwritten
        if: matrix.os == 'ubuntu-latest'
        run: go test -short -tags xmlscanpoison ./...

      # The allocation budgets are not measured under the race detector.
      - name: Allocation budgets
        run: go test -run 'TestAllocationBudgets' -v .

      # Go's fuzzing engine sometimes ends a run with "context deadline
      # exceeded" and no failing input, when its time runs out while a
      # worker on a busy runner has not answered (FuzzFormula on main,
      # 2026-11-23; FuzzEncryptionInfo, 2026-11-24). Such a run is tried
      # once more. A run that writes a failing input fails at once.
      - name: Fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: |
          fuzz() {
            for attempt in 1 2; do
              if out=$(go test -run '^$' -fuzz "^$1\$" -fuzztime "$2" "$3" 2>&1); then
                echo "$out" | tail -n 2
                return 0
              fi
              echo "$out" | tail -n 30
              if echo "$out" | grep -q 'Failing input written' || ! echo "$out" | grep -q 'context deadline exceeded'; then
                return 1
              fi
              echo "::warning::$1: the fuzzing engine's time ran out with no failing input; trying once more"
            done
            return 1
          }
          fuzz FuzzOpen 30s .
          fuzz FuzzDocx 30s .
          fuzz FuzzXML 30s ./internal/xmlscan
          fuzz FuzzNumFmt 20s ./internal/numfmt
          fuzz FuzzXlsx 30s .
          fuzz FuzzXlsb 30s .
          fuzz FuzzXlsbLinksTablesPivots 30s .
          fuzz FuzzRecords 20s ./internal/xlsb
          fuzz FuzzFormula 20s ./internal/xlsb
          fuzz FuzzPptx 30s .
          fuzz FuzzFlatOPC 30s .
          fuzz FuzzSpreadsheetML 30s .
          fuzz FuzzWordML 30s .
          fuzz FuzzCFB 20s ./internal/cfb
          fuzz FuzzEncryptionInfo 20s ./internal/crypt

  dependencies:
    # The series rule: the standard library and go-fast modules only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Only go-fast-core may be required
        run: |
          extra=$(go list -m all | awk 'NR>1 {print $1}' | grep -v '^github.com/AOShei/go-fast-core$' || true)
          if [ -n "$extra" ]; then echo "unexpected modules:"; echo "$extra"; exit 1; fi
      - name: Only standard library and go-fast packages may be imported
        run: |
          extra=$(go list -deps -test -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./... | grep -v '^github.com/AOShei/go-fast-' || true)
          if [ -n "$extra" ]; then echo "unexpected packages:"; echo "$extra"; exit 1; fi
